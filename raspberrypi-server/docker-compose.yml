version: '3.8'

services:
  traffic-map-server:
    build: .
    container_name: traffic-map-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Persistent storage for logs and firmware
      - ./data/logs:/data/logs
      - ./data/firmware:/data/firmware
    environment:
      - TZ=Europe/London  # Set your timezone
    networks:
      - traffic-map-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  traffic-map-network:
    driver: bridge